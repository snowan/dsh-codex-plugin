- insert:
    - id: llm-codex-cli
      name: '@snowan/dsh-codex-plugin'
      config:
        codexCommand: codex
        allowCodexNativeTools: false
        contextWindow: 200000
        modelCacheMs: 300000
        sessionIdleMs: 900000

- id: agent-default-model
  config:
    provider: codex-cli
    model: gpt-5.6-terra

# Installing the bundle makes Codex the default for newly created agents.
# DSH Web's model picker can still choose any other registered provider.
